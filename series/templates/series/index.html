{% extends "series/base.html" %}

{% block content %}

<a href="{% url 'new'%}">Add a new movie.</a>

    {% if movie_list %}

        <ul>
            {% for movie in movie_list %}

                <li><a href="{% url 'movie' movie.id %}">{{ movie.movie_name }}</a>
                  ({{movie.released_year}}) - {{movie.id}}
                </li>

            {% endfor %}
        </ul>

    {% else %}

    <p>No movie is available.</p>

        {% endif %}

    {% endblock %}
