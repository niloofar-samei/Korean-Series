{% extends "series/base.html" %}

{% block content %}

    {% if movie_list %}

        <ul>
            {% for movie in movie_list %}

                <li><a href="/movie/{{ movie.id }}/">{{ movie.movie_name }}</a></li>

            {% endfor %}
        </ul>

    {% else %}

    <p>No movie is available.</p>

        {% endif %}

    {% endblock %}
