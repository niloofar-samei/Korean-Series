{% extends "series/base.html"%}

{% load static %}
{% block content %}

<div class="row">
  <div class="col-sm-6" style="border: 2px solid yellow;">
    <div class="card" style="width: 18rem; margin-left: auto; margin-right: auto">
      <img class="card-img-top" src="{% static 'series/movie/happiness.jpg' %}" alt="Card image cap">
        <div class="card-body">
          <h5 class="card-title">{{ movie.movie_name }} ({{ movie.released_year }})</h5>

            <p class="card-text">

              When a strange virus begins to spread...

            </p>

            <a href="#" class="card-link">Vote Up</a>
        </div>
    </div>
</div>

  <div class="col-sm-3" style="border: 1px solid green">
    <div class="card">
      <img class="card-img-top" src="{% static 'series/actress/actress1.jpg' %}" alt="Card image cap" style="border-radius: 100px; width:130px; margin-left: auto; margin-right: auto; margin-top: 20px">
      <div class="card-body">
        <p class="card-text">

            <p>
              {% for each in actress %}
                  <i>{{ each }}</i>
              {% endfor %}
            </p>

        </p>

      </div>
    </div>
  </div>
  <div class="col-sm-3" style="border: 1px solid green">
    <div class="card">
      <img class="card-img-top" src="{% static 'series/actor/actor1.jpg' %}" alt="Card image cap" style="border-radius: 100px; width:130px; margin-left: auto; margin-right: auto; margin-top: 20px">
      <div class="card-body">
        <p class="card-text">

            <p>
              {% for each in actor %}
                  <i>{{ each }}</i>
              {% endfor %}
            </p>

        </p>

      </div>
    </div>
  </div>

{% endblock %}
