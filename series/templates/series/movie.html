{% extends "series/base.html"%}

{% load static %}
{% block content %}

    <a href="#" class="badge badge-success" style="color:red">Success</a>

    <div class="card" style="width: 18rem;">
        <img class="card-img-top" src="{% static 'series/happiness.jpg' %}" alt="Card image cap">
        <div class="card-body">
            <h5 class="card-title">{{ movie.movie_name }} ({{ movie.released_year }})</h5>

            <p class="card-text">
                <p>ACTORS:</p>

                <p>
                {% for each in actor %}
                    <i>{{ each }}</i>
                {% endfor %}
                </p>

                <p>ACTRESSES:</p>

                <p>
                {% for each in actress %}
                    <i>{{ each }}</i>
                {% endfor %}
                </p>
            </p>

        </div>
    </div>

{% endblock %}
